          <a class="nav-item" href="#/thinking" data-route="thinking">

            <span>思维闯关</span>

          </a>

            <span class="nav-icon"><svg><use href="#i-palette"></use></svg></span>

            <span>家长中心</span>
          </a>

          <div class="sidebar-streak">

    <div class="app-main">
      <header class="topbar">
        <div class="topbar-heading">
          <button class="icon-button mobile-menu" type="button" data-action="toggle-sidebar" aria-label="打开导航">
            <svg><use href="#i-menu"></use></svg>
          </button>
          <div>
            <p class="topbar-eyebrow" id="topbar-eyebrow">2026年11月9日 · 星期一</p>
            <h1 class="topbar-title" id="topbar-title">学习桌面</h1>
          </div>
        </div>

        <div class="topbar-actions">
          <button class="ask-pill" type="button" data-action="open-ai" aria-label="问问小思">
            <svg><use href="#i-sparkles"></use></svg>
            <span>问问小思</span>
            <kbd>Ctrl K</kbd>
          </button>
          <button class="icon-button install-button" id="install-button" type="button" data-action="install-app" aria-label="安装到主屏幕" title="安装到主屏幕" hidden>
            <svg><use href="#i-download"></use></svg>
            <span class="install-label">安装</span>
          </button>
          <span class="device-chip" id="eye-care-chip">
            <svg><use href="#i-leaf"></use></svg>
            <span>未来纸护眼</span>
          </span>
          <button class="icon-button" type="button" data-action="toggle-eye" aria-label="切换护眼模式" title="切换护眼模式">
            <svg><use href="#i-eye"></use></svg>
          </button>
          <button class="icon-button has-dot" type="button" data-action="open-notifications" aria-label="通知">
            <svg><use href="#i-bell"></use></svg>
          </button>
          <div class="status-cluster" aria-label="设备状态">
            <svg class="status-icon"><use href="#i-wifi"></use></svg>
            <span class="battery"><span class="battery-fill"></span></span>
            <span id="clock">16:42</span>
          </div>
          <button class="profile-button" type="button" data-action="open-children" aria-label="切换孩子">
            <span class="avatar" id="topbar-avatar">宇</span>
            <span class="profile-caret"><svg><use href="#i-chevron-down"></use></svg></span>
          </button>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>
